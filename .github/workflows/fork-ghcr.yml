name: Fork GHCR
on:
  push:
    branches: [feature/ingester-drain]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: fork-ghcr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'pandada8/openobserve'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check preStop protocol
        run: python3 deploy/fork/test_prestop.py
      - name: Reclaim runner disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/fork/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pandada8/openobserve:ingester-drain
            ghcr.io/pandada8/openobserve:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
